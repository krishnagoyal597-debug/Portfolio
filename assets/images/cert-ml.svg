<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgMl" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF" />
      <stop offset="100%" stop-color="#DBEAFE" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bgMl)" rx="12" />
  <rect x="20" y="20" width="560" height="360" fill="none" stroke="#2563EB" stroke-width="2" stroke-dasharray="6 6" rx="8" />
  
  <!-- Certificate Header Banner -->
  <rect x="40" y="50" width="520" height="60" fill="#2563EB" rx="6" />
  <text x="300" y="88" font-family="Inter, sans-serif" font-size="22" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">CERTIFICATE OF ACHIEVEMENT</text>
  
  <!-- Content -->
  <text x="300" y="160" font-family="Inter, sans-serif" font-size="14" fill="#6B7280" text-anchor="middle">This is to certify that</text>
  <text x="300" y="195" font-family="Inter, sans-serif" font-size="26" font-weight="800" fill="#111827" text-anchor="middle">KRISHNA GOYAL</text>
  <text x="300" y="235" font-family="Inter, sans-serif" font-size="16" font-weight="600" fill="#2563EB" text-anchor="middle">Machine Learning Specialization</text>
  <text x="300" y="260" font-family="Inter, sans-serif" font-size="13" fill="#6B7280" text-anchor="middle">Issued by Coursera / DeepLearning.AI</text>
  
  <!-- Seal -->
  <circle cx="500" cy="310" r="32" fill="#2563EB" opacity="0.15" />
  <circle cx="500" cy="310" r="24" fill="none" stroke="#2563EB" stroke-width="2" />
  <text x="500" y="315" font-family="Inter, sans-serif" font-size="18" text-anchor="middle" fill="#2563EB">✓</text>
</svg>
